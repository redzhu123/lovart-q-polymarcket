# Polymarket Quant Platform V1.0 配置文件
#
# Simulation Only -- 所有参数仅用于模拟研究，不涉及真实交易。
# 由 pm-models::Config::load("config.toml") 读取；不读环境变量。

[scanner]
# 每轮扫描间隔（秒）。driver.rs 设 1s 下限保护，0 会被视作 1s
# （旧默认 0 = 无界空转，会导致 paper_portfolio.csv 疯长，已修 B4）
scan_interval_secs = 30
# 套利判定阈值：YES+NO 低于此值视为潜在机会
opportunity_threshold = 0.99
# 调试开关（旧版，已由 [logging].log_level 接管；保留以兼容旧配置解析）
debug = true
# B6: 机会最大跟踪时长（秒）；超过此时间仍未从市场消失则强制到期平仓。0=不限。
max_opportunity_age_secs = 3600

# 日志级别（V1.01 第九节）-- 控制控制台输出详尽程度。
#   ERROR 仅错误 / WARN +警告 / INFO +统计仪表盘 / DEBUG +调试明细（默认）/ TRACE +全量市场转储
[logging]
log_level = "DEBUG"

# 数据源（V1.02）-- 控制使用哪个 Provider 与内存缓存 TTL。
#   provider  = gamma | clob | mock（clob 暂未实现，会返回明确错误）
#   cache_ttl = 内存缓存存活秒数（仅内存，无 Redis / 无数据库）
[datasource]
provider = "gamma"
cache_ttl = 60

[portfolio]
# 初始资金（USDC）
initial_capital = 10000.0
# 最大同时持仓数
max_positions = 10
# 单笔持仓最大成本（USDC）
max_position_size = 100.0

[execution]
# Execution Simulator 初始资金（USDC）
capital = 10000.0
# 待处理订单数上限（风控）
max_pending_orders = 20
# 单笔订单固定成本（USDC）
order_notional = 100.0
# 最大成交延迟（扫描周期数，0..=N 随机）
max_fill_delay = 3
# 最大等待扫描周期数，到达仍未完全成交 -> Cancelled / Expired
max_wait_scans = 5

# ---- V1.06 新增 ----
# 最大队列长度
max_queue_size = 1000
# 最大重试次数
max_retries = 3
# 重试延迟（毫秒）
retry_delay_ms = 1000
# 订单超时（毫秒）
timeout_ms = 30000
# 每秒最大订单数（速率限制）
max_orders_per_second = 10
# 突发容量（一次可发送的最大 burst）
burst_size = 5
# Gateway 类型：mock | polymarket | kalshi（当前仅 mock）
gateway = "mock"
# Execution 事件 CSV 路径
events_csv = "data/execution_events.csv"
# Execution 报告 CSV 路径
report_csv = "data/execution_report.csv"

# ============================================================================
# V1.05 Risk Engine 配置
# ============================================================================
# 所有风险参数从此段读取，禁止写死。
[risk]
# 仓位规模策略：Fixed | FixedRisk | Kelly | Volatility | Liquidity | Confidence
position_sizer = "Fixed"
# 固定仓位金额（USDC，Fixed 策略）
fixed_size = 100.0
# 固定风险比例（FixedRisk 策略，0.01 = 1%）
risk_ratio = 0.01

# 仓位限制
max_positions = 10
max_position_size = 100.0
max_open_orders = 20
max_single_capital = 500.0
max_capital_usage = 0.5

# 亏损限制
max_daily_loss = 1000.0
max_consecutive_losses = 5
max_drawdown = 0.2

# 暴露限制
max_market_exposure = 0.3
max_category_exposure = 0.5
max_side_exposure = 0.6

# 市场质量
min_liquidity = 100.0
min_depth = 50.0
max_slippage = 0.02
max_volatility = 0.5

# 评分阈值（Risk Score 0~100）
accept_threshold = 70.0
review_threshold = 40.0

# CSV 路径
risk_events_csv = "data/risk_events.csv"
risk_dashboard_csv = "data/risk_dashboard.csv"

[paths]
data_dir = "data"
opportunities_csv = "data/opportunities.csv"
shadow_csv = "data/shadow_trades.csv"
paper_orders_csv = "data/paper_orders.csv"
paper_positions_csv = "data/paper_positions.csv"
paper_portfolio_csv = "data/paper_portfolio.csv"
execution_csv = "data/execution_orders.csv"
backtest_report_csv = "data/backtest_report.csv"
# B3: 检测时即落盘（与纸面订单对账用），非仅生命周期结束写盘
detected_opportunities_csv = "data/detected_opportunities.csv"

[replay]
# 回放速度倍率：1=真实速度，10=10 倍速
speed = 10
# 历史扫描步长（秒）
step_secs = 10

# ============================================================================
# V1.08 Exchange Gateway 配置
# ============================================================================
# 统一交易所网关。默认 DryRun — 真实下单必须 enable_live=true。
[gateway]
# Gateway 类型："mock" | "polymarket" | "kalshi" | "dex" | "cex"
gateway_type = "mock"
# 是否启用真实交易。默认 false（DryRun），真实下单必须设为 true
enable_live = false
# Polymarket API 基础 URL
polymarket_api_url = "https://clob.polymarket.com"
# Polymarket WebSocket URL
polymarket_ws_url = "wss://ws.polymarket.com"
# API 密钥（不写配置文件！从环境变量读取）
api_key = ""
api_key_env = "POLYMARKET_API_KEY"
api_secret_env = "POLYMARKET_API_SECRET"
api_passphrase_env = "POLYMARKET_API_PASSPHRASE"

# ---- 重试配置 ----
max_retries = 3
retry_base_ms = 500
retry_max_ms = 15000
backoff_multiplier = 2.0

# ---- Circuit Breaker ----
cb_failure_threshold = 5
cb_recovery_timeout_ms = 30000
cb_half_open_max = 3

# ---- 速率限制 ----
rate_limit_per_sec = 10
rate_limit_per_min = 300

# ---- 健康检查 ----
health_check_interval_secs = 30
api_timeout_ms = 10000

# ---- 同步 ----
order_sync_interval_secs = 5
balance_sync_interval_secs = 30
position_sync_interval_secs = 15

# ---- Metrics ----
gateway_metrics_csv = "data/gateway_metrics.csv"
gateway_health_csv = "data/gateway_health.csv"

[backtest]
# 模拟入场滑点（Simulation Only）：entry_sum = best_sum * (1 + slippage)
entry_slippage = 0.005
# 策略名称（写入报告，便于多次回测对比）
strategy_name = "ShadowStrategy-v1.0"
