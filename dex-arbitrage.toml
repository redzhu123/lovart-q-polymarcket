# 同链 Uniswap V2 兼容的有界两跳/三跳循环套利。
# 当前示例使用 Polygon 公共 RPC + QuickSwap V2 / SushiSwap V2 的 WETH-USDC 池。
enabled = true
chain_id = 137
rpc_http_url = "https://polygon-bor-rpc.publicnode.com"
rpc_ws_url = "wss://polygon-bor-rpc.publicnode.com"
execution_mode = "shadow"
# 快速扫描使用 latest；PublicNode 免费端点只开放最新日志，不能主动回退区块。
confirmation_mode = "latest"
poll_interval_ms = 500
resync_interval_blocks = 100
# 如果节点限制 eth_getLogs，运行时会自动降级为每个新区块读取全部池储备。
log_query_delay_blocks = 0
# 储备降级模式的最大并发 RPC 数；公共节点建议 4，专用 RPC 可提高到 8。
worker_count = 4
queue_capacity = 1024
max_opportunity_age_blocks = 1
max_state_block_gap = 1
gas_units_fallback = 220000
# 以下两个值仅在实时 RPC/价格池数据关闭时作为回退配置。
max_fee_per_gas = "30000000000"
native_price_anchor = "250000"
min_gross_profit_anchor = "1000000"
min_net_profit_anchor = "500000"
max_gas_anchor = "100000000"
min_roi_bps = 5
risk_buffer_bps = 20

[market_data]
use_realtime_gas_price = true
# 在 RPC 返回的实时建议 Gas Price 上增加 10%，用于降低下一块价格变化造成的低估。
gas_price_buffer_bps = 1000

[market_data.native_price_pool]
name = "quickswap_v2_wpol_usdc_oracle"
address = "0x6e7a5FAFcec6BB1e78bAe2A1F0B612012BF14827"
factory = "0x5757371414417b8C6CAad45bAeF941aBc7d3Ab32"
wrapped_native_address = "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"
anchor_token = "USDC"
native_symbol = "POL"
native_is_token0 = true

[routes]
enable_two_hop = true
enable_three_hop = true
enable_four_hop = true
max_route_hops = 4
max_routes_total = 100000
max_routes_per_anchor = 20000
max_edges_per_token_pair = 10
allowed_anchor_tokens = ["USDC"]
allowed_intermediate_tokens = ["WETH", "USDT", "DAI", "WBTC"]

[optimizer]
min_input = "1000000"
max_input = "10000000000"
minimum_search_step = "1000"
max_pool_reserve_bps = 100
seed_reserve_bps = [1, 3, 10, 30, 100]
max_quote_evaluations = 128
local_search_iterations = 24
minimum_theoretical_edge_bps = 1

[risk]
max_leg_price_impact_bps = 100
max_total_price_impact_bps = 200
minimum_pool_liquidity = "1"
min_three_hop_net_profit = "1000000"
min_three_hop_roi_bps = 8

[gas]
two_hop_fallback_gas = 180000
three_hop_fallback_gas = 260000
four_hop_fallback_gas = 340000
gas_units_buffer_bps = 1500

[execution]
max_steps = 4
default_leg_slippage_bps = 10
three_hop_leg_slippage_bps = 15
deadline_seconds = 30
# simulate_only 模式必须配置该地址；真实交易广播仍然关闭。
