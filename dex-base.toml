# Base 主网同链 V2 Shadow 套利。地址均按链上 getPair 验证。
enabled = true
chain_id = 8453
rpc_http_url = "https://base-rpc.publicnode.com"
rpc_ws_url = "wss://base-rpc.publicnode.com"
execution_mode = "shadow"
confirmation_mode = "latest"
poll_interval_ms = 500
resync_interval_blocks = 100
log_query_delay_blocks = 0
worker_count = 4
queue_capacity = 1024
max_opportunity_age_blocks = 1
max_state_block_gap = 1
gas_units_fallback = 400000
max_fee_per_gas = "1000000000"
native_price_anchor = "3000000000"
min_gross_profit_anchor = "2000000"
min_net_profit_anchor = "1000000"
max_gas_anchor = "5000000"
min_roi_bps = 8
risk_buffer_bps = 30

[market_data]
use_realtime_gas_price = true
gas_price_buffer_bps = 1500

[market_data.native_price_pool]
name = "uniswap_v2_weth_usdc_oracle"
address = "0x88A43bBDF9D098eEC7bCEda4e2494615dfD9bB9C"
factory = "0x8909Dc15e40173Ff4699343b6eB8132c65e18eC6"
wrapped_native_address = "0x4200000000000000000000000000000000000006"
anchor_token = "USDC"
native_symbol = "ETH"
native_is_token0 = true

[routes]
enable_two_hop = true
enable_three_hop = true
enable_four_hop = true
max_route_hops = 4
max_routes_total = 100000
max_routes_per_anchor = 20000
max_edges_per_token_pair = 10
allowed_anchor_tokens = ["USDC"]
allowed_intermediate_tokens = ["WETH", "USDbC", "DAI", "cbBTC"]

[optimizer]
min_input = "1000000"
max_input = "10000000000"
minimum_search_step = "1000"
max_pool_reserve_bps = 100
seed_reserve_bps = [1, 3, 10, 30, 100]
max_quote_evaluations = 128
local_search_iterations = 24
minimum_theoretical_edge_bps = 1

[risk]
max_leg_price_impact_bps = 100
max_total_price_impact_bps = 200
minimum_pool_liquidity = "1"
min_three_hop_net_profit = "2000000"
min_three_hop_roi_bps = 10

[gas]
# L2 Shadow 无法精确拆出 L1 数据费，因此使用更保守的 Gas units 与缓冲。
two_hop_fallback_gas = 350000
three_hop_fallback_gas = 500000
four_hop_fallback_gas = 650000
gas_units_buffer_bps = 3000

[execution]
max_steps = 4
default_leg_slippage_bps = 10
three_hop_leg_slippage_bps = 15
deadline_seconds = 30

