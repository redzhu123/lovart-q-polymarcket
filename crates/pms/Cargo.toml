[package]
name = "pm-pms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "PMS -- Portfolio Management System 企业级投资组合管理系统（资金/持仓/盈亏/估值/风险敞口唯一管理中心）"

[dependencies]
# 内部依赖（仅依赖 OMS + 基础类型，禁止依赖 Strategy/Risk/Scanner）
pm-core = { workspace = true }
pm-oms = { workspace = true }
pm-gateway = { workspace = true }
pm-execution = { workspace = true }
pm-storage = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 时间
chrono = { workspace = true }

# CSV 持久化
csv = { workspace = true }

# 日志（中文）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 异步
tokio = { workspace = true }
async-trait = { workspace = true }

# 随机数（ID 生成）
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
