[package]
name = "pm-api-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Polymarket API Workflow Engine -- 验证所有 API 能组成完整交易生命周期，独立于 Strategy / Risk / Gateway"

[dependencies]
# 唯一业务依赖：已认证的 API 测试框架（ApiClient / Validator / LiveGuard / order_dryrun）
pm-api-test = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }
# 时间
chrono = { workspace = true }
# 日志（中文）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 异步
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "market_workflow"
path = "tests/market_workflow.rs"

[[test]]
name = "order_workflow"
path = "tests/order_workflow.rs"

[[test]]
name = "balance_workflow"
path = "tests/balance_workflow.rs"

[[test]]
name = "position_workflow"
path = "tests/position_workflow.rs"

[[test]]
name = "replay_workflow"
path = "tests/replay_workflow.rs"

[[test]]
name = "live_workflow"
path = "tests/live_workflow.rs"
