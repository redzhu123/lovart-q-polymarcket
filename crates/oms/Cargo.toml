[package]
name = "pm-oms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Polymarket OMS -- Order Management System 企业级订单管理层（Execution 与 Gateway 之间唯一入口）"

[dependencies]
# 内部业务依赖（仅 Gateway + Execution + 基础类型，禁止依赖 Strategy/Risk/Scanner）
pm-gateway = { workspace = true }
pm-execution = { workspace = true }
pm-core = { workspace = true }
pm-models = { workspace = true }
pm-storage = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }
# 时间
chrono = { workspace = true }
# CSV 持久化
csv = { workspace = true }
# 日志（中文）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 异步
tokio = { workspace = true }
async-trait = { workspace = true }
# 随机数（ID 生成）
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "validation"
path = "tests/validation.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "state_machine"
path = "tests/state_machine.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"